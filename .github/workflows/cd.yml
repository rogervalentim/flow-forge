name: CD

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
        required: true

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for keyless signing (cosign) and OIDC deploys

env:
  NODE_VERSION: "22.20.0"
  REGISTRY: ghcr.io
  IMAGE_WEB: ${{ github.repository }}/web
  IMAGE_STORYBOOK: ${{ github.repository }}/storybook

jobs:
  # ── 1. Verify the exact commit before publishing anything ─────────────────
  verify:
    name: Verify (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  # ── 2. Publish both images to GHCR ────────────────────────────────────────
  publish:
    name: Publish images (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: web
            dockerfile: docker/Dockerfile.web
          - image: storybook
            dockerfile: docker/Dockerfile.storybook
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # ── 3. Scan the published web image for known CVEs ────────────────────────
  scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.ref_name }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

  # ── 4. Deploy (environment-gated, manual approval on production) ──────────
  deploy:
    name: Deploy → ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: [publish, scan]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Write deploy manifest
        run: |
          mkdir -p deploy
          cat > deploy/release.json <<EOF
          {
            "service": "flowforge-ui",
            "environment": "${{ github.event.inputs.environment || 'production' }}",
            "commit": "${{ github.sha }}",
            "tag": "${{ steps.tag.outputs.tag }}",
            "images": {
              "web": "${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:${{ steps.tag.outputs.tag }}",
              "storybook": "${{ env.REGISTRY }}/${{ env.IMAGE_STORYBOOK }}:${{ steps.tag.outputs.tag }}"
            }
          }
          EOF
          cat deploy/release.json

      - name: Push to deployment target
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::notice::No DEPLOY_HOOK_URL secret configured — release manifest published as an artifact only."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK_URL" \
            -H "Content-Type: application/json" \
            --data @deploy/release.json

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: deploy/release.json
          retention-days: 90

  # ── 5. GitHub Release for tag builds ─────────────────────────────────────
  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
