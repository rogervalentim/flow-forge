name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22.20.0"

jobs:
  # ── 1. Static analysis: types, lint-level rules, formatting ────────────────
  typecheck:
    name: Typecheck (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit (strict, noUncheckedIndexedAccess)
        run: npm run typecheck

  # ── 2. Unit + component tests ──────────────────────────────────────────────
  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vitest
        run: npm run test -- --reporter=default --reporter=junit --outputFile=reports/vitest-junit.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # ── 3. Storybook interaction tests (real Chromium via Playwright) ─────────
  stories:
    name: Storybook interaction tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Vitest browser mode (play functions)
        run: npm run test:stories

  # ── 4. Build artifacts ────────────────────────────────────────────────────
  build:
    name: Build (app + Storybook)
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npx vite build

      - name: Build Storybook
        run: npm run build-storybook

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload Storybook
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static/
          retention-days: 7

  # ── 5. Container build smoke test (no registry push) ──────────────────────
  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.web
          target: runtime
          push: false
          load: true
          tags: flowforge/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Storybook image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.storybook
          target: runtime
          push: false
          load: true
          tags: flowforge/storybook:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the web container
        run: |
          docker run -d --name web-smoke -p 8080:8080 flowforge/web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q "FlowForge"
          docker rm -f web-smoke

  # ── Gate for branch protection ────────────────────────────────────────────
  ci:
    name: CI success
    if: always()
    needs: [typecheck, unit, stories, build, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          echo "typecheck=${{ needs.typecheck.result }}"
          echo "unit=${{ needs.unit.result }}"
          echo "stories=${{ needs.stories.result }}"
          echo "build=${{ needs.build.result }}"
          echo "docker=${{ needs.docker.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
